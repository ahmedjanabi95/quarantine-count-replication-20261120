name: Site-specific guard calibration
on: workflow_dispatch
permissions:
  contents: read
jobs:
  replicate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Record runner provenance
        run: |
          mkdir -p provenance
          printf '%s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" "$RUNNER_ENVIRONMENT" "$ImageOS" "$ImageVersion" > provenance/runner.txt
          uname -srvmo >> provenance/runner.txt
          lscpu >> provenance/runner.txt
          test "$RUNNER_ENVIRONMENT" = github-hosted
      - name: Prepare the frozen Debian guest
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends qemu-system-x86 qemu-utils genisoimage e2fsprogs
          test -c /dev/kvm
          bash review_evidence_v11/image_pinned.sh
      - name: Run the original campaign
        run: sudo bash review_evidence_v16/launch.sh remote01
      - name: Score the raw journals
        run: |
          sudo chown -R "$(id -u):$(id -g)" review_evidence_v16/remote01
          mkdir -p remote_analysis
          python3 review_evidence_v16/audit.py review_evidence_v16/remote01/campaign > remote_analysis/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quarantine-evidence
          path: |
            provenance
            review_evidence_v16/remote01
            remote_analysis
